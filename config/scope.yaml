# The safety fence. Only these addresses may be imported; everything else is refused
# before any scan file is read.
# Owner authorization: live discovery is authorised across the local LAN (192.168.0.0/24),
# the enumerated 172.28 lab addresses, and the exact public targets documented below.
# The lab segment must stay /32-enumerated so it does not include the canary.
# The canary must never be scanned.
# Exception, owner-approved 2026-09-22: 45.33.32.156 (scanme.nmap.org) is Nmap's public
# scan-me host with standing permission for LIGHT scans - common ports only, no
# aggressive or DoS-class script scanning, no repeated hammering.
# Owner-authorized 2026-09-27: pentest-ground.com agent site resolves to 178.79.134.182.
# Keep this exact /32; refresh the DNS pin if the hosting IP changes.
# Owner-authorized 2026-10-22: HCL AltoroJ / Testfire training app, published as a
# deliberately vulnerable demo and listed by OWASP ZAP as a test application.
# Restrict to its current A record; refresh this /32 only after verifying a DNS change.
# Owner-requested 2026-10-26: exact loopback-only network-service environments.
